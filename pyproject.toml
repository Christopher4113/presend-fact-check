[project]
name = "presend-fact-check"
version = "0.1.0"
description = "Send-layer guardrail that blocks outreach drafts with stale facts, checked against the prospect's live website."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "openai>=1.40",
    "selectolax>=0.3.21",
    "rank-bm25>=0.2.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "anthropic>=2.12.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
